name: clubline
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clubline
      POSTGRES_USER: clubline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubline -d clubline"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  migrate:
    build: {context: .., dockerfile: api/Dockerfile}
    environment:
      ConnectionStrings__Database: Host=db;Database=clubline;Username=clubline;Password=${POSTGRES_PASSWORD}
      App__PublicUrl: https://${PUBLIC_HOST:?Set the public hostname}
      App__WorkersEnabled: "false"
      App__DataPath: /data
    volumes: ["api-data:/data"]
    command: ["--migrate"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: api/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Database=clubline;Username=clubline;Password=${POSTGRES_PASSWORD}
      App__PublicUrl: https://${PUBLIC_HOST}
      App__TrustedProxyNetworks__0: ${CLUBLINE_NETWORK_SUBNET:-172.28.0.0/24}
      App__DataPath: /data
      App__MigrateOnStart: "false"
      App__SeedDemo: "false"
      Email__ApiKey: ${EMAIL_API_KEY:-}
      Email__From: ${EMAIL_FROM:-}
      Push__PublicKey: ${PUSH_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-}
      Billing__SecretKey: ${STRIPE_SECRET_KEY:-}
      Billing__LiveMode: ${STRIPE_LIVE_MODE:-false}
      Billing__ConnectWebhookSecret: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      Billing__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Billing__CommunityPriceId: ${STRIPE_COMMUNITY_PRICE_ID:-}
      Billing__ClubPriceId: ${STRIPE_CLUB_PRICE_ID:-}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-}
      Logging__LogLevel__Microsoft: Warning
    volumes: ["api-data:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_APP_URL: https://${PUBLIC_HOST}
    environment:
      API_INTERNAL_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on: [api]
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    environment: {PUBLIC_HOST: "${PUBLIC_HOST}"}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres:
  api-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: ${CLUBLINE_NETWORK_SUBNET:-172.28.0.0/24}
